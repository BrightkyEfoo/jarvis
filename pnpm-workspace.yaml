packages:
  - apps/*
  - packages/*

# pnpm 11+: native build scripts are denied unless explicitly allowed here.
allowBuilds:
  tree-sitter: true
  tree-sitter-bash: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.285'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.285'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.285'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.285'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.285'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.285'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.285'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.285'
  - '@anthropic-ai/claude-agent-sdk@0.3.285'
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
  - vitest@5.0.3
  - mailparser@3.9.32
  - nodemailer@10.0.13
