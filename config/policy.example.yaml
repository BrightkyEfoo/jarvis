# Jarvis — policy
#
# Copy this file, edit it, then seal it (the sealed copy is root-owned and read-only for Jarvis):
#   ops/scripts/seal-policy.sh config/policy.example.yaml   (run as yourself; it asks sudo for the copy)
#
# N4 (forbidden) rules live in the code (packages/policy) and cannot be relaxed from here:
# rm, sudo, passwd, dscl, fdesetup, csrutil, security, force-push to main, pipes into
# interpreters, credential folders (~/.ssh, ~/.aws, Keychains…), .env / *.pem files, etc.
# This file can only ADD restrictions to those, and grant levels N0–N3.
version: 1

filesystem:
  # Everything outside these folders is invisible to Jarvis.
  read_roots:
    - ~/jarvis-work
    - ~/Desktop/jarvis
  write_roots:
    - ~/jarvis-work
  # Extra protected paths, on top of the built-in list.
  deny: []

shell:
  timeout_sec: 120
  max_output_bytes: 1000000
  # Anything not listed here is N3 (confirmation + PIN).
  allow:
    - { cmd: ls, level: 0 }
    - { cmd: pwd, level: 0 }
    - { cmd: cat, level: 0 }
    - { cmd: head, level: 0 }
    - { cmd: tail, level: 0 }
    - { cmd: wc, level: 0 }
    - { cmd: grep, level: 0 }
    - { cmd: rg, level: 0 }
    - { cmd: echo, level: 0 }
    - { cmd: date, level: 0 }
    - { cmd: sleep, level: 0 }
    - { cmd: yes, level: 0 }
    - { cmd: which, level: 0 }
    - { cmd: git, sub: [status, diff, log, show, branch, rev-parse, remote, blame, ls-files], level: 0 }
    - { cmd: git, sub: [add, commit, switch, checkout, stash, fetch, pull, worktree, merge, rebase], level: 1 }
    - { cmd: git, sub: [push], level: 2, reason: publishes commits }
    - { cmd: pnpm, sub: [test, lint, typecheck, build, install, run], level: 1 }
    - { cmd: mkdir, level: 1 }
    - { cmd: touch, level: 1 }
    - { cmd: cp, level: 1 }
    - { cmd: mv, level: 1 }
    - { cmd: open, level: 1, reason: opens an app or a file }
    - { cmd: code, level: 1, reason: opens VS Code }
  # Extra N4 rules, e.g. { cmd: npm, sub: [publish], reason: never publish packages }
  deny:
    - { cmd: npm, sub: [publish], reason: never publish packages }
    - { cmd: pnpm, sub: [publish], reason: never publish packages }

# N2 actions approved without asking — only in a clean session (no external content read).
# Example: - { tool: outbox_send, when: { to: [brightky@example.com] } }
auto_approve: []

approvals:
  timeout_sec: 120

pin:
  max_attempts: 3
  lockout_min: 15

# Subscription quota guard (Max plan). Paid overage always stops Jarvis.
quota:
  reserve_interactive_pct: 30
  night_max_utilization: 70

models:
  conversation: claude-sonnet-5-5
  planning: claude-opus-5-5
  # Reasoning effort for the conversation model (latency vs depth): low | medium | high | xhigh | max
  effort: medium

limits:
  max_turns: 25
  # Runaway-loop guard (client-side estimate), not billing.
  max_budget_usd_per_query: 3

macos:
  # Apps opened without asking (N1). Any other app needs a confirmation (N2).
  # Terminal, iTerm, Script Editor, Automator, Installer, System Settings… are handled in code:
  # N3 alone, N4 with a document (they would execute it).
  apps:
    - Visual Studio Code
    - Finder
    - Safari
    - Google Chrome
    - Notes
    - Calendar
    - Music
    - Spotify
    - Slack
    - WhatsApp
    - Telegram
    - Postman
    - Figma
  # Shortcuts with an explicit level; unlisted shortcuts are N3.
  # Shortcuts whose name mentions money/payment/bank/transfer are always N4 (built-in).
  # Example: - { name: "Convert video to GIF", level: 1 }
  shortcuts: []
  shortcuts_deny: []

# GitHub / GitLab / Trello (tokens in the Keychain: docs/SETUP-FORGES.md). Reading is N0,
# commenting and moving cards N2. Merging is never automatic (ADR-023).
forges:
  gitlab_url: https://gitlab.com
  max_diff_chars: 60000
  trello_label: jarvis

# Claude Code workers (S6): one git worktree per task, macOS sandbox for the shell, one clean
# commit in Brightky's name, push to a jarvis/… branch, PR opened (never merged).
workers:
  max_parallel: 1 # Max 5x: 2 at most is comfortable
  model: claude-sonnet-5-5 # "complex" tasks use models.planning (Opus)
  max_turns: 150
  max_budget_usd: 15 # anti-runaway cap per task, API-equivalent (the subscription pays)
  draft_pr: false
  dir: ~/jarvis-work/.jarvis-workers

# Driving the Mac when there is no API: Brightky's browser profile, Notes, Reminders, and any app
# through screenshots + clicks/keystrokes (done by Jarvis.app, which holds the macOS permissions).
# Built into the code and NOT relaxable here: banking/payment/password/account-security sites,
# payment buttons, password/code/card fields, Terminal-like apps, System Settings, password
# managers and Jarvis itself are never driven (N4). This section can only add to those lists.
computer:
  browser: Arc # or "Google Chrome"
  # Sites / apps where clicks that send or publish (Envoyer, Publier, Return in a chat…) need no
  # confirmation. Deleting, merging, approving or closing is always confirmed, even here.
  # Example: [github.com, trello.com]
  commit_allow_domains: []
  commit_allow_apps:
    - Notes
    - TextEdit
  forbidden_domains: []
  forbidden_apps: []

projects:
  # Sub-folders of these are projects ("ouvre VS Code sur le projet X"). Must be in read_roots.
  roots:
    - ~/jarvis-work
  # Individual project folders.
  paths:
    - ~/Desktop/jarvis

memory:
  # Brightky's Markdown notes: Jarvis reads them at each session start and never writes them.
  notes_dir: ~/Jarvis/memory
  prompt_max_chars: 8000

mail:
  # Mailboxes Jarvis may read. Credentials never go here: they are stored in the Keychain by
  # `jarvis google connect <client.json> <id>` (Gmail + Calendar) or `jarvis mail add <id>` (IMAP).
  accounts:
    - { id: perso, type: gmail, email: brightkyefoo@gmail.com }
    # Pro mailbox over IMAP (check your employer's / clients' AI policy first). TLS is mandatory;
    # for a self-signed server certificate, paste it in ca_pem — verification is never disabled.
    # - id: scriptify
    #   type: imap
    #   email: brightky@scriptify.cm
    #   imap: { host: mail.example.cm, port: 993, secure: true }
    #   smtp: { host: mail.example.cm, port: 465, secure: true }
  triage_max: 25

calendar:
  google_account: perso
