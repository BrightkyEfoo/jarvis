name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Linux on purpose: in a private repo, macOS minutes count 10x against the free quota
    # (zero cost beyond the Claude subscription). Tests needing macOS use MemoryStore / skip.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned by commit SHA (supply chain); tags noted for readability.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm perf
        env:
          # Shared CI runners are slower and noisier than the M1 Pro the budgets target.
          PERF_BUDGET_FACTOR: '4'
